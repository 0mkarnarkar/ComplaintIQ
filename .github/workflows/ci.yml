name: ComplaintIQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 app.py model/ --max-line-length=120 --ignore=E501

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t complaintiq:latest .

      - name: Run container smoke test
        run: |
          docker run -d --name ciq -p 5000:5000 complaintiq:latest
          sleep 5
          curl -f http://localhost:5000/health
          curl -f -X POST http://localhost:5000/classify \
            -H "Content-Type: application/json" \
            -d '{"complaint": "My card was stolen and used for unauthorized purchases"}'
          docker stop ciq
